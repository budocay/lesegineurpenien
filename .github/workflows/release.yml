# Publie une version quand on pousse un tag « v* » (par exemple v0.6.0).
# Fabriqué par ./release.sh <version> sur le Mac ; ce workflow refait la construction sur un serveur Linux
# avec exactement Godot 4.7.2, lance le test rapide, puis publie les archives dans une release GitHub.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version du projet
        run: |
          version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag, project.godot=$version"
          if [ -z "$version" ] || [ "$version" != "$tag" ]; then
            echo "Le tag v$tag ne correspond pas à application/config/version ($version) dans project.godot." >&2
            exit 1
          fi

      - name: Mémoriser Godot et ses modèles d'export
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Télécharger Godot et les modèles d'export
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates
          cd "$(mktemp -d)"
          curl -L --fail -sS -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -L --fail -sS -o modeles.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q modeles.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Construire les trois plateformes (avec le test rapide)
        run: GODOT="$HOME/godot-bin/godot" ./build.sh tout --test

      - name: Garder les journaux en cas d'échec
        if: failure()
        run: |
          tail -n 60 build/journal_test.txt 2>/dev/null || true
          tail -n 60 build/journal_build.txt 2>/dev/null || true

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            build/SeigneurDesAnneauxPeniens-*-windows.zip \
            build/SeigneurDesAnneauxPeniens-*-macos.zip \
            build/SeigneurDesAnneauxPeniens-*-linux.tar.gz \
            build/SHA256SUMS.txt \
            --title "Le Seigneur des Anneaux Péniens ${GITHUB_REF_NAME}" \
            --generate-notes
